plugins {
    id 'java'
    id "com.gradleup.shadow" version "9.6.1"
    id "io.papermc.paperweight.userdev" version "${paperWeightUserDevVersion}"
}

group = 'fr.openmc.riftengine'
version = '0.5-SNAPSHOT'

repositories {
    mavenCentral()
    // * GeyserMC
    maven {url "https://repo.opencollab.dev/main/"}
    // * PaperMC
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    // * ItemsAdder
    maven {url "https://maven.devs.beer/"}
    // * Jitpack
    maven { url = "https://jitpack.io" }
}

dependencies {
    paperweight.paperDevBundle "${minecraftVersion}.build.${paperVersion}"

    // Dependancies
    compileOnly "beer.devs:itemsadder-api:${itemsAdderVersion}"
    compileOnly "org.geysermc.geyser:api:${geyserApiVersion}"

    implementation("com.github.minecraft-library:asset-renderer:master-SNAPSHOT")

    compileOnly files("libs/OpenMC.jar")
    implementation "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

processResources {
    filteringCharset = 'UTF-8'

    def pluginProps = ["version": version, "minecraftVersion": minecraftVersion]
    inputs.properties(pluginProps)

    filesMatching('paper-plugin.yml') {
        expand(pluginProps)
    }
}

// * Propriété locale
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream {
        localProperties.load(it)
    }
}

tasks.jar {
    destinationDirectory.set(file('./builds/'))
}

tasks.shadowJar {
    destinationDirectory.set(file('./builds/'))
    archiveFileName.set('RiftEngine.jar')
}

tasks.register('copyJarToServer', Copy) {
    dependsOn tasks.shadowJar

    from tasks.shadowJar

    if (localProperties.getProperty('minecraftServerDir')) {
        into file("${localProperties.getProperty('minecraftServerDir')}/plugins")
    }
}